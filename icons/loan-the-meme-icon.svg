    <path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(90)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(120)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(150)"/>
    <path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(180)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(210)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(240)"/>
    <path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(270)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(300)"/><path d="M0 0 L-60 -620 L60 -620Z" transform="rotate(330)"/>
  </g>
  <circle cx="512" cy="440" r="330" fill="url(#glow)"/>
