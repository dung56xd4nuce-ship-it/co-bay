    <path d="M270 400 C250 460 255 520 300 560 L330 420Z" fill="url(#helm)" stroke="#2a1a12" stroke-width="12" stroke-linejoin="round"/>
    <path d="M754 400 C774 460 769 520 724 560 L694 420Z" fill="url(#helm)" stroke="#2a1a12" stroke-width="12" stroke-linejoin="round"/>
    <!-- sừng vàng (kuwagata) -->
    <path d="M440 240 C380 170 330 150 300 120 C340 200 380 240 450 285Z" fill="url(#gold)" stroke="#2a1a12" stroke-width="12" stroke-linejoin="round"/>
    <path d="M584 240 C644 170 694 150 724 120 C684 200 644 240 574 285Z" fill="url(#gold)" stroke="#2a1a12" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="512" cy="285" r="34" fill="#ff3b3b" stroke="#2a1a12" stroke-width="10"/><circle cx="502" cy="275" r="10" fill="#ffd0d0"/>
    <!-- lông mày giận dữ -->
    <path d="M380 400 L470 430" stroke="#2a1a12" stroke-width="26" stroke-linecap="round"/>
    <path d="M644 400 L554 430" stroke="#2a1a12" stroke-width="26" stroke-linecap="round"/>
    <!-- mắt -->
    <ellipse cx="430" cy="475" rx="34" ry="40" fill="#2a1a12"/><ellipse cx="594" cy="475" rx="34" ry="40" fill="#2a1a12"/>
    <circle cx="442" cy="461" r="12" fill="#fff"/><circle cx="606" cy="461" r="12" fill="#fff"/>
    <!-- má hồng -->
    <ellipse cx="370" cy="540" rx="34" ry="18" fill="#ff8f8f" opacity="0.7"/><ellipse cx="654" cy="540" rx="34" ry="18" fill="#ff8f8f" opacity="0.7"/>
    <!-- miệng hét -->
    <path d="M462 560 C470 610 554 610 562 560 Z" fill="#7a1010" stroke="#2a1a12" stroke-width="10" stroke-linejoin="round"/>
    <path d="M478 566 L546 566" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <!-- râu -->
    <path d="M400 600 C440 690 584 690 624 600 C600 640 560 650 512 650 C464 650 424 640 400 600Z" fill="#3a2418" stroke="#2a1a12" stroke-width="8"/>
