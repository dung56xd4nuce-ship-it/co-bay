      <path d="M-24 -430 L0 -490 L24 -430Z" fill="url(#steel)" stroke="#2a1a12" stroke-width="10" stroke-linejoin="round"/>
      <rect x="-95" y="120" width="190" height="40" rx="18" fill="url(#gold)" stroke="#2a1a12" stroke-width="10"/>
      <rect x="-22" y="160" width="44" height="130" rx="10" fill="#6b1d1d" stroke="#2a1a12" stroke-width="10"/>
      <circle cx="0" cy="305" r="30" fill="url(#gold)" stroke="#2a1a12" stroke-width="10"/>
    </g>
    <g transform="translate(512 520) rotate(38)">
      <rect x="-24" y="-430" width="48" height="560" rx="10" fill="url(#steel)" stroke="#2a1a12" stroke-width="10"/>
      <path d="M-24 -430 L0 -490 L24 -430Z" fill="url(#steel)" stroke="#2a1a12" stroke-width="10" stroke-linejoin="round"/>
      <rect x="-95" y="120" width="190" height="40" rx="18" fill="url(#gold)" stroke="#2a1a12" stroke-width="10"/>
      <rect x="-22" y="160" width="44" height="130" rx="10" fill="#6b1d1d" stroke="#2a1a12" stroke-width="10"/>
      <circle cx="0" cy="305" r="30" fill="url(#gold)" stroke="#2a1a12" stroke-width="10"/>
    </g>
